# .github/workflows/negocio-avisos.yml
# Avisos diarios de pagos y renovaciones (I'M FIT).
name: Avisos de negocio
on:
  schedule:
    - cron: '0 7 * * *'   # 09:00 hora peninsular (07:00 UTC). Ajusta si lo quieres a otra hora.
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin nodemailer
      - run: node negocio-avisos.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
