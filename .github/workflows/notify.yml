# Recordatorio de seguimiento. Node 20, igual que negocio-avisos.
# El cron se queda en 17:00 UTC (18:00 CET / 19:00 CEST): es un aviso de
# tarde, no el de pagos de la mañana, así que el margen de las 05:00 UTC no aplica.
name: Notificaciones diarias

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
        working-directory: notify
      - run: node notify.js
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
