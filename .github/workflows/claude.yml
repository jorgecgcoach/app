# .github/workflows/claude.yml  — repo: jorgecgcoach/app
# Basado en anthropics/claude-code-action@v1 (examples/claude.yml y docs/usage.md, revisado 03-11-2026).
# Autenticación: suscripción Claude Pro mediante CLAUDE_CODE_OAUTH_TOKEN (generado con `claude setup-token`).
# Claude SOLO actúa cuando Jorge escribe "@claude" en un issue, comentario de issue/PR o review.
# Claude trabaja en una rama claude/... y propone PR: nunca hace merge a main por sí mismo.

name: Claude Code (@claude)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Sin permisos por defecto a nivel de workflow; el job pide solo lo necesario.
permissions: {}

# Una ejecución a la vez por issue/PR (evita gasto duplicado).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # 1) Solo si el texto contiene @claude.  2) Solo si lo escribe jorgecgcoach (repo público: capa extra
    #    además del control de "write access" que ya aplica la action).
    if: |
      github.event.sender.login == 'jorgecgcoach' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # crear rama y commits en claude/...
      pull-requests: write   # abrir/comentar PR
      issues: write          # responder en issues
      id-token: write        # requerido por la autenticación por defecto vía Claude GitHub App
      actions: read          # leer resultados de CI en PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # trigger_phrase por defecto: "@claude"
          claude_args: |
            --max-turns 15
            --append-system-prompt "Responde siempre en español (es-ES). Sigue estrictamente CLAUDE.md. Cambios pequeños y revisables. Nunca incluyas secretos, tokens ni datos de clientes. No hagas merge: deja el PR para revisión de Jorge."
